name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            vannethdev/vanneth-dev:latest
            vannethdev/vanneth-dev:${{ github.sha }}

          build-args: |
            VITE_NODE_ENV=${{ vars.VITE_NODE_ENV }}
            VITE_NODE_PUBLIC_URL=${{ vars.VITE_NODE_PUBLIC_URL }}
            VITE_NODE_BUILD_VERSION=${{ vars.VITE_NODE_BUILD_VERSION }}
            VITE_DEFAULT_LANGUAGE=${{ vars.VITE_DEFAULT_LANGUAGE }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_TELEGRAM_CHAT_ID=${{ vars.VITE_TELEGRAM_CHAT_ID }}
            VITE_HOTJAR_ID=${{ secrets.VITE_HOTJAR_ID }}
            VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}
            VITE_API_CLIENT_KEY=${{ secrets.VITE_API_CLIENT_KEY }}
            VITE_API_CLIENT_SECRET=${{ secrets.VITE_API_CLIENT_SECRET }}
            VITE_API_SECRET_KEY=${{ secrets.VITE_API_SECRET_KEY }}
            VITE_TELEGRAM_BOT_TOKEN=${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
